name: Unity Art Integration

# Executes the real Unity art integration inside GitHub Actions using GameCI and
# Unity 2022.3.62f1: imports the generated GLB kit, builds URP materials, creates
# and populates every CircuitVisualProfile, maps circuits, wires the runtime
# dressing catalog, runs EditMode + PlayMode tests, produces a standalone build,
# attempts screenshots, uploads artifacts, and opens a PR with the generated files.
#
# It does NOT silently skip Unity if licence secrets are missing — the preflight
# job fails fast and names the exact missing secret.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Integration mode"
        type: choice
        default: full
        options:
          - full           # integrate + build + tests + commit generated files (PR)
          - validate-only  # integrate + tests only (no build artifact, no PR)
  push:
    branches:
      - "claude/**"        # art-pipeline development branches
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-art-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"

concurrency:
  group: unity-art-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------ preflight
  preflight:
    name: Preflight (licence secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        name: Verify Unity licence secrets are present
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          # GameCI accepts either a Personal licence file (UNITY_LICENSE = the .ulf
          # contents) OR a Pro/Plus serial trio (UNITY_EMAIL + UNITY_PASSWORD +
          # UNITY_SERIAL). Secrets are never printed.
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "Personal licence secret (UNITY_LICENSE) detected."
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] && [ -n "${UNITY_SERIAL:-}" ]; then
            echo "Pro/Plus licence secrets (UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL) detected."
          else
            echo "::error title=Missing Unity licence secrets::Provide EITHER UNITY_LICENSE (personal .ulf contents) OR all of UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL in the repository's GitHub Actions secrets."
            [ -z "${UNITY_LICENSE:-}" ] && echo "::error::missing secret: UNITY_LICENSE (personal-licence path)"
            [ -z "${UNITY_EMAIL:-}" ]    && echo "::error::missing secret: UNITY_EMAIL (pro-licence path)"
            [ -z "${UNITY_PASSWORD:-}" ] && echo "::error::missing secret: UNITY_PASSWORD (pro-licence path)"
            [ -z "${UNITY_SERIAL:-}" ]   && echo "::error::missing secret: UNITY_SERIAL (pro-licence path)"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- integration
  integrate:
    name: Integrate + Build + Test
    needs: preflight
    if: needs.preflight.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 1..11 + 13: art integration (import, prefabs, materials, profiles, catalog,
      # runtime wiring) followed by a standalone build, in one Unity session. A
      # single always-build step keeps GameCI's builder happy (it expects a build
      # output); the PR / artifact steps below are what differ by event/mode.
      - name: Integrate art + build
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: StandaloneLinux64
          buildMethod: F1Game.Editor.ArtPipeline.CIBuild.IntegrateAndBuild
          buildName: F1Game
          buildsPath: build
          allowDirtyBuild: true
          versioning: None

      # 12: EditMode + PlayMode tests on the now-integrated project.
      - name: Run EditMode + PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        continue-on-error: true
        with:
          unityVersion: 2022.3.62f1
          testMode: all
          artifactsPath: artifacts/test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      # 15: artifacts — reports, tests, screenshots, build, logs.
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-integration-report
          path: |
            Docs/ArtPipeline/AUTOMATION_REPORT.md
            Docs/ArtPipeline/KIT_IMPORT_REPORT.md
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload standalone build
        if: ${{ always() && github.event_name != 'pull_request' && inputs.mode != 'validate-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: standalone-linux64
          path: build/StandaloneLinux64
          if-no-files-found: ignore

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            **/*.log
            !Library/**
          if-no-files-found: ignore

      # Generated-file handling: commit the Unity-generated prefabs, materials,
      # profiles, catalog, .meta and report to a dedicated branch and open a PR
      # into main. Loop-safe: the push trigger only watches claude/** (never
      # automation/**), and the commit carries [skip ci].
      - name: Open PR with generated art assets
        if: ${{ github.event_name != 'pull_request' && inputs.mode != 'validate-only' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/unity-art-integration
          base: main
          commit-message: "chore(art): Unity-generated prefabs, materials, profiles + catalog [skip ci]"
          title: "Unity art integration — generated prefabs, materials & profiles"
          body: |
            Automated by `.github/workflows/unity-art-integration.yml`
            (run ${{ github.run_id }}).

            Contains the Unity-editor-generated art assets produced by
            `AutomatedArtIntegration.Run`: kit prefabs (LODGroup + collider +
            provenance), URP materials, `CircuitVisualProfile` assets, the
            `CircuitProfileCatalog`, and their `.meta` files. Merging activates
            the runtime `TrackDressing` hook so every circuit is dressed
            automatically.

            See the `art-integration-report` and `unity-test-results` artifacts.
          add-paths: |
            Assets/**
            Docs/ArtPipeline/AUTOMATION_REPORT.md
            Docs/ArtPipeline/KIT_IMPORT_REPORT.md
          delete-branch: false
